name: Build Jax APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify final source package
        shell: bash
        run: |
          set -euo pipefail
          test -f "JAX_FINAL_CLEAN_SOURCE.zip"
          unzip -tq "JAX_FINAL_CLEAN_SOURCE.zip"

      - name: Extract final Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jax-source
          mkdir -p /tmp/jax-source
          unzip -q "JAX_FINAL_CLEAN_SOURCE.zip" -d /tmp/jax-source

          test -f /tmp/jax-source/settings.gradle
          test -f /tmp/jax-source/build.gradle
          test -f /tmp/jax-source/app/build.gradle
          test -f /tmp/jax-source/app/src/main/AndroidManifest.xml
          test -f /tmp/jax-source/app/src/main/java/com/jax/gemini/JaxAccessibilityService.java
          test -f /tmp/jax-source/app/src/main/java/com/jax/gemini/MainActivity.java
          test -f /tmp/jax-source/app/src/main/java/com/jax/gemini/PromptParser.java
          test -f /tmp/jax-source/app/src/main/java/com/jax/gemini/JaxStore.java

          cp -a /tmp/jax-source/. ./

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-provider: basic

      - name: Verify final project
        shell: bash
        run: |
          set -euo pipefail
          test -d app
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          grep -q "versionName '1.0.1'" app/build.gradle
          echo "Final project verification passed."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "APK ready: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jax-Gemini-Android-Automator-v1.0.1-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
